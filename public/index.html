<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOH Australia - Experience Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #050507;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      .font-tech {
        font-family: "Orbitron", sans-serif;
      }
      /* Animation Utilities */
      .animate-float {
        animation: float 6s ease-in-out infinite;
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      /* Morphing Sphere Animation */
      @keyframes orb-morph {
        0%,
        100% {
          border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
        }
        33% {
          border-radius: 70% 30% 46% 54% / 30% 29% 71% 70%;
        }
        66% {
          border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
        }
      }
      .animate-orb-morph {
        animation: orb-morph 10s ease-in-out infinite;
      }

      @keyframes orb-rotate {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .animate-orb-rotate {
        animation: orb-rotate 20s linear infinite;
      }
      .animate-orb-rotate-reverse {
        animation: orb-rotate 25s linear infinite reverse;
      }

      /* Energy Texture Filter */
      .neon-energy-texture {
        filter: url(#neon-energy);
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.2);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@^19.2.4",
          "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
          "react/": "https://esm.sh/react@^19.2.4/",
          "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
          "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
          "react-markdown": "https://esm.sh/react-markdown@^10.1.0",
          "d3": "https://esm.sh/d3@^7.9.0",
          "three": "https://esm.sh/three@^0.182.0",
          "@react-three/fiber": "https://esm.sh/@react-three/fiber@^9.5.0",
          "@react-three/drei": "https://esm.sh/@react-three/drei@^10.7.7"
        }
      }
    </script>
  </head>
  <body>
    <!-- SVG Filters -->
    <svg style="position: absolute; width: 0; height: 0" aria-hidden="true">
      <!-- NEON ENERGY FILTER: Creates the "swirling energy" texture inside the sphere -->
      <filter id="neon-energy">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.5"
          numOctaves="3"
          result="noise"
        >
          <animate
            attributeName="seed"
            from="1"
            to="100"
            dur="20s"
            repeatCount="indefinite"
          />
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="25" />
        <feColorMatrix type="saturate" values="1.5" />
        <feBlend mode="screen" in2="SourceGraphic" />
      </filter>

      <!-- NEON BLOOM: Creates the soft halo around the sphere -->
      <filter id="neon-bloom" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur1" />
        <feGaussianBlur in="SourceGraphic" stdDeviation="30" result="blur2" />
        <feMerge>
          <feMergeNode in="blur2" />
          <feMergeNode in="blur1" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </svg>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
